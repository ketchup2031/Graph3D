name: Linux installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test on Ubuntu 26.04
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace ubuntu:26.04 bash -euc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build dpkg-dev desktop-file-utils \
              qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins \
              libocct-data-exchange-dev libocct-visualization-dev libtbb-dev libgl-dev libx11-dev \
              xvfb xauth fonts-dejavu-core libgl1-mesa-dri
            desktop-file-validate packaging/linux/graph3d.desktop
            cmake -S . -B build/package-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DGRAPH3D_GUI_TESTS=ON
            cmake --build build/package-linux --parallel 4
            ctest --test-dir build/package-linux --output-on-failure -E "^viewport$"
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a build/package-linux/viewport_test \
              startPageWorkflow surfaceAndAnnotationMenus -o -,txt
            cpack --config build/package-linux/CPackConfig.cmake -B build/package-linux
          '
      - name: Install in a clean container and check startup
        run: |
          docker run --rm --volume "$PWD/build/package-linux:/packages:ro" ubuntu:26.04 bash -euc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              /packages/graph3d_*_amd64.deb xvfb xauth fonts-dejavu-core libgl1-mesa-dri
            dpkg --verify graph3d
            test -f /usr/share/applications/graph3d.desktop
            ldd /usr/bin/Graph3D | tee /tmp/graph3d-dependencies
            if grep -q "not found" /tmp/graph3d-dependencies; then exit 1; fi
            code=0
            QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 8s xvfb-run -a Graph3D || code=$?
            test "$code" -eq 124
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Graph3D-Ubuntu-26.04-amd64
          path: build/package-linux/graph3d_*_amd64.deb
          if-no-files-found: error

  cachyos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test in the CachyOS container
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace cachyos/cachyos:latest bash -euc '
            pacman -Sy --noconfirm --needed archlinux-keyring cachyos-keyring
            pacman -Su --noconfirm --needed base-devel cmake ninja qt6-base opencascade tbb \
              xorg-server-xvfb xorg-xauth ttf-dejavu mesa desktop-file-utils
            useradd --create-home builder
            install -d -o builder -g builder /workspace/build/package-cachyos
            install -o builder -g builder -m 644 packaging/linux/PKGBUILD /workspace/build/package-cachyos/PKGBUILD
            cd /workspace/build/package-cachyos
            runuser -u builder -- env GRAPH3D_SOURCE_DIR=/workspace makepkg --noconfirm
          '
      - name: Install in a clean CachyOS container and check startup
        run: |
          docker run --rm --volume "$PWD/build/package-cachyos:/packages:ro" cachyos/cachyos:latest bash -euc '
            pacman -Sy --noconfirm --needed archlinux-keyring cachyos-keyring
            pacman -Su --noconfirm --needed xorg-server-xvfb xorg-xauth ttf-dejavu mesa
            pacman -U --noconfirm /packages/graph3d-*-x86_64.pkg.tar.zst
            pacman -Qkk graph3d
            test -f /usr/share/applications/graph3d.desktop
            ldd /usr/bin/Graph3D | tee /tmp/graph3d-dependencies
            if grep -q "not found" /tmp/graph3d-dependencies; then exit 1; fi
            code=0
            QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 8s xvfb-run -a Graph3D || code=$?
            test "$code" -eq 124
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Graph3D-CachyOS-x86_64
          path: build/package-cachyos/graph3d-*-x86_64.pkg.tar.zst
          if-no-files-found: error
